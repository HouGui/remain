[project]
site_name = "REMAIN"
site_url = "https://hougui.github.io/remain/"
repo_url = "https://github.com/HouGui/remain"
site_description = "Project and subproject reports, Excel KPIs, and printable HTML summaries"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = false
nav = [
  { "Get started" = [
    { "Welcome" = "index.md" },
    { "Install" = "installation.md" },
    { "Short tutorials" = "tutorials.md" }
  ] },
  { "Reference" = [
    { "Prepare a workspace" = "workspaces.md" },
    { "Configuration" = "configuration.md" },
    { "Outputs" = "outputs.md" },
    { "Troubleshooting" = "troubleshooting.md" }
  ] },
  { "Languages" = [
    { "Deutsch" = "de/index.md" },
    { "Français" = "fr/index.md" }
  ] },
  { "Development" = [
    { "Contribute" = "development.md" },
    { "Rust API reference" = "api/index.html" },
    { "Release and deploy" = "deployment.md" }
  ] }
]

[project.theme]
language = "en"
features = ["navigation.sections", "navigation.footer", "content.code.copy"]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.font]
text = ""
code = ""
