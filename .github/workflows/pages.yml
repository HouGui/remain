name: Publish documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/remain-core/**'
      - 'locales/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'zensical.toml'
      - 'scripts/build-docs.sh'
      - '.github/workflows/pages.yml'
      - '.github/actions/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    # Publishing is opt-in, public-repository only, and restricted to the default branch.
    if: ${{ vars.REMAIN_PAGES_ENABLED == 'true' && !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-docs
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
