[workspace]
members = ["crates/remain-core", "crates/remain-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
authors = ["REMAIN developers"]

[workspace.dependencies]
anyhow = "1.0"
calamine = "0.37"
csv = "1.4"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
glob = "0.3"
lopdf = { version = "0.46", default-features = false }
polars = { version = "0.55", default-features = false }
rfd = "0.17"
rust_xlsxwriter = "0.101"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
ttf-parser = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.dev]
debug = 0

[profile.test]
debug = 0
